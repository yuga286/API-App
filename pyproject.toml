[project]
name = "attendenc_integration"
authors = [
    { name = "Vivira", email = "admin@example.com" }
]
description = "Secure desktop biometric attendance API layer for Frappe, ERPNext and HRMS."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"
erpnext = ">=16.0.0,<18.0.0"
hrms = ">=16.0.0,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
